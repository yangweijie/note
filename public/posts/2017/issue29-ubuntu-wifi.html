    <h1 class="post-title">小米笔记本安装 ubuntu 后，wifi 无法使用的解决方案：</h1>
    <div class="post-meta">
      <time>2017-07-10</time>
      <span class="tags"><a class="tag" href="../../tags/blog.html">#blog</a><a class="tag" href="../../tags/software.html">#software</a><a class="tag" href="../../tags/linux.html">#linux</a><a class="tag" href="../../tags/shell.html">#shell</a></span>
    </div>
    <div class="post-content"><p>~~~ shell<br>
vi /etc/modprobe.d/blacklist.conf<br>
~~~</p>
<p>最后一行加入</p>
<p>~~~ conf<br>
blacklist acer-wmi<br>
~~~</p>
<p>保存退出重启就好了。</p></div>
